# Mac-blur-quattro: theme-relative glass surfaces.
# Color roles resolve from colors.toml, so palette edits remain dynamic.

[bar]
background = "background"
background-alpha = 0.35
scale-with-font = true
size-horizontal = 26
size-vertical = 28

[hyprland]
active-border = "accent"
active-border-foreground = "foreground"

[style]
normal-color = "foreground"
normal-fill-alpha = 0.04
normal-border = "foreground"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "foreground"
hover-cursor-fill-alpha = 0.08
hover-cursor-border = "foreground"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.25
focus-color = "foreground"
focus-fill-alpha = 0.08
focus-border = "foreground"
focus-border-width = 1
focus-border-alpha = 0.25
selected-color = "foreground"
selected-fill-alpha = 0.18
selected-border = "foreground"
selected-border-width = 1
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background = "background"
background-alpha = 0.55
border = "transparent"
border-alpha = 0.0
border-width = 0

[tooltip]
background = "background"
background-alpha = 0.55
border = "transparent"
border-alpha = 0.0
border-width = 0

[notifications]
background = "background"
background-alpha = 1.0
border = "hyprland.active-border"
border-alpha = 1.0

[launcher]
background = "background"
background-alpha = 0.95
border = "hyprland.active-border-foreground"
border-alpha = 1.0
scrim = "background"
scrim-alpha = 0.5
selected-background = "foreground"
selected-background-alpha = 0.08
selected-border = "transparent"
selected-border-alpha = 0.0

[menu]
background = "background"
background-alpha = 0.55
border = "transparent"
border-alpha = 0.0
border-width = 0
scrim = "background"
scrim-alpha = 0.0
selected-background = "foreground"
selected-background-alpha = 0.08
selected-border = "transparent"
selected-border-alpha = 0.0

[polkit]
background = "background"
background-alpha = 1.0
border = "hyprland.active-border-foreground"
border-error = "urgent"
border-alpha = 1.0
scrim = "background"
scrim-alpha = 0.5

[lock]
background = "background"
background-alpha = 0.8
border = "hyprland.active-border-foreground"
border-active = "hyprland.active-border"
border-error = "urgent"
border-alpha = 1.0
selection = "accent"
selection-alpha = 0.45

[image-picker]
scrim = "background"
scrim-alpha = 0.5
selected-border = "accent"
selected-border-alpha = 1.0
unselected-border = "foreground"
unselected-border-alpha = 0.28

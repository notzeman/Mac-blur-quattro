[theme]
mode = "dark"

[colors]
# Base surfaces (Tokyo Night Storm base)
background = "#1a1b26"          # Main deep background
dark_background = "#16161e"     # Dark background for panels
darker_background = "#0f0f14"   # Deep background for Hyprlock
lighter_background = "#24283b"  # Light background for active elements
selection = "#292e42"           # Text selection color

# Window borders (Required parameter for Omarchy)
border = "#24283b"              # Inactive window border color

# Text and accents (Frozen Nord Frost)
foreground = "#d8dee9"          # Main text
light_foreground = "#e5e9f0"    # Light readable text
bright_foreground = "#eceff4"   # Snow-white text
dark_foreground = "#4c566a"     # Dark text

accent = "#88c0d0"              # Main accent: Arctic blue
accent_dim = "#81a1c1"          # Secondary accent
muted = "#4c566a"               # Muted color

# ANSI color palette for terminals and applications
[terminal]
black = "#1a1b26"
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"
white = "#e5e9f0"

bright_black = "#4c566a"
bright_red = "#bf616a"
bright_green = "#a3be8c"
bright_yellow = "#ebcb8b"
bright_blue = "#8fbcbb"
bright_magenta = "#b48ead"
bright_cyan = "#88c0d0"
bright_white = "#eceff4"

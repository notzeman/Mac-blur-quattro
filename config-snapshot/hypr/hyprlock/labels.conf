# Wolfykq's centered clock/date layout, using the locally installed Nerd Font.
label {
    monitor =
    text = cmd[update:1000] sh ~/.config/hypr/hyprlock/scripts/current_time.sh
    color = $lock_foreground
    font_size = 95
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] sh ~/.config/hypr/hyprlock/scripts/current_date.sh
    color = $lock_muted
    font_size = 15
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Keep optional media information on-screen at different monitor resolutions.
label {
    monitor =
    text = cmd[update:2000] sh ~/.config/hypr/hyprlock/scripts/current_song.sh
    color = $lock_muted
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, 70
    halign = center
    valign = bottom
}
